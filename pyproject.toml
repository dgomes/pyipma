[build-system]
requires = ["setuptools>=84.2.1", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyipma"
dynamic = ["version"]
description = "Python library to retrieve information from Instituto Português do Mar e Atmosfera."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [
    { name = "Diogo Gomes", email = "diogogomes@gmail.com" },
]
dependencies = [
    "aiohttp>=3.14.5",
    "geopy>=2.5.0",
]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/dgomes/pyipma"

[project.optional-dependencies]
test = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
]
dev = [
    "build>=1.6.1",
    "flake8>=7.5.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "twine>=7.0.0",
    "typing-extensions>=4.16.0",
]

[tool.setuptools]
packages = ["pyipma"]

[tool.setuptools.dynamic]
version = { attr = "pyipma.__version__" }

[tool.setuptools.package-data]
pyipma = ["py.typed"]

[tool.mypy]
files = ["pyipma", "tests/typing"]
python_version = "3.14"
strict = true

[[tool.mypy.overrides]]
module = ["geopy", "geopy.*"]
ignore_missing_imports = true
